name: Linux desktop

on:
  push:
    branches: [main, codex/linux-port]
    paths:
      - 'linux/**'
      - 'core/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'linux/**'
      - 'core/**'
      - '.github/workflows/linux.yml'

jobs:
  amd64-shell:
    name: Qt shell and Swift bridge — amd64
    runs-on: ubuntu-24.04
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v5
      - name: Confirm Ubuntu 24.04 package baseline
        run: grep -q '^VERSION_ID="24.04"$' /etc/os-release
      - name: Install Qt, SQLite and X11 build tools
        run: |
          apt-get update
          apt-get install -y libsqlite3-dev cmake ninja-build g++ file \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtqml-models \
            qml6-module-qtqml-workerscript \
            qt6-qpa-plugins
      - name: Build Swift bridge
        run: swift build --package-path linux/app/bridge -j 2
      - name: Build Qt shell
        run: |
          cmake -S linux/app/ui -B linux/app/ui/build -G Ninja
          cmake --build linux/app/ui/build -j 2
      - name: Exercise sidebar navigation
        run: ctest --test-dir linux/app/ui/build --output-on-failure
      - name: Check bridge and bundled core on amd64
        run: |
          bridge=$(swift build --show-bin-path --package-path linux/app/bridge)/ChotkiLinuxBridge
          printf '{"v":1,"id":1,"op":"hello"}\n{"v":1,"id":2,"op":"snapshot"}\n' | "$bridge" --review > /tmp/chotki-bridge.jsonl
          grep -q '"mode":"review"' /tmp/chotki-bridge.jsonl
          grep -q '"psalmOneVerses":6' /tmp/chotki-bridge.jsonl
          file "$bridge" linux/app/ui/build/chotki-linux
      - name: Load the Qt window without a display server
        run: |
          bridge=$(swift build --show-bin-path --package-path linux/app/bridge)/ChotkiLinuxBridge
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8s linux/app/ui/build/chotki-linux --review "$bridge" > /tmp/chotki-ui.log 2>&1
          result=$?
          set -e
          cat /tmp/chotki-ui.log
          test "$result" -eq 124
      - name: Build release binaries and alpha package
        run: |
          swift build --package-path linux/app/bridge -c release -j 2
          cmake -S linux/app/ui -B linux/app/ui/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build linux/app/ui/release -j 2
          bridge=$(swift build --show-bin-path --package-path linux/app/bridge -c release)/ChotkiLinuxBridge
          linux/tools/package-deb.sh linux/app/ui/release/chotki-linux "$bridge" linux/dist
          dpkg-deb --contents linux/dist/*.deb | head -40
      - uses: actions/upload-artifact@v4
        with:
          name: chotki-linux-amd64-alpha
          path: linux/dist/*.deb
          if-no-files-found: error

  amd64-deb-install:
    name: Install alpha .deb on Ubuntu 24.04 — amd64
    needs: amd64-shell
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chotki-linux-amd64-alpha
          path: linux-dist
      - name: Install without development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ./linux-dist/*.deb
          dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' chotki
          file /usr/lib/chotki/chotki-linux /usr/lib/chotki/ChotkiLinuxBridge
      - name: Launch installed review shell headlessly
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8s chotki --review > /tmp/chotki-installed.log 2>&1
          result=$?
          set -e
          cat /tmp/chotki-installed.log
          test "$result" -eq 124
          test -f "$HOME/.cache/chotki-linux-review/chotki.sqlite"
