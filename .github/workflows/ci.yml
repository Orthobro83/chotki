name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The point of this job is not the tests. It is proving that core/ builds on a
  # non-Apple platform, so the portability rule fails loudly the day it is broken
  # rather than a year from now when the port starts.
  core-linux:
    name: core — Linux
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      # core reaches SQLite through the C library rather than a Swift wrapper,
      # so the Linux image needs its headers. macOS gets them from the SDK.
      - name: Install SQLite headers
        run: apt-get update && apt-get install -y libsqlite3-dev
      - name: Build
        run: swift build --package-path core
      - name: Test
        run: swift test --package-path core

  # The Kotlin core, held to the same standard as the Swift one. It is a plain
  # JVM module with no Android dependency, so there is nothing Android to import
  # even by accident — the rule the Swift core needs a grep job to enforce is
  # enforced here by the compiler. What this job adds is that it builds and
  # passes away from the machine it was written on.
  android-core:
    name: core — Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Test
        working-directory: android
        run: ./gradlew :core:test --no-daemon

  core-macos:
    name: core — macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build --package-path core
      - name: Test
        run: swift test --package-path core

  # Mechanical enforcement of the architecture decision. A reviewer will not
  # reliably catch an Apple-only import; this will.
  portability-guard:
    name: core stays portable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: core/ must not import Apple-only frameworks
        run: |
          if grep -rnE '^ *import +(AppKit|SwiftUI|UIKit|Cocoa|UserNotifications|ServiceManagement|CoreGraphics|Quartz|ObjectiveC)\b' core/Sources core/Tests; then
            echo "::error::core/ must import Foundation and SQLite only — see design.md"
            exit 1
          fi
          echo "core/ imports are portable"

  macos-app:
    name: macOS app bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      # The interface layer holds real behaviour, and two of the first bugs
      # found by hand lived here rather than in core.
      - name: Test
        run: swift test --package-path macos
      - name: Build and sign the bundle
        run: ./macos/build-app.sh release
      - name: Verify signature
        run: codesign --verify --verbose=2 macos/dist/Chotki.app
