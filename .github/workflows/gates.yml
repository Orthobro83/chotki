name: Behaviour gates

# Not on every push. Each device downloads a system image and boots an
# emulator, so this is minutes and gigabytes — run it before handing out an
# apk, or when something touches the manifest, insets, alarms or permissions.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  gates:
    name: ${{ matrix.device }}
    runs-on: ubuntu-latest
    strategy:
      # One failing level should not hide the others: knowing it breaks on 35
      # and 36 but not 34 is most of the diagnosis.
      fail-fast: false
      matrix:
        device: [api31, api33, api34, api35, api36, tabletApi36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # KVM is what makes an emulator on a runner bearable rather than hopeless.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the suite
        working-directory: android
        run: ./gradlew :app:${{ matrix.device }}DebugAndroidTest --no-daemon

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-report
          path: android/app/build/reports/androidTests/
