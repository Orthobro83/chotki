org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official

# Given explicitly rather than left to the default.
#
# Packaging a Compose app is the memory-hungry step, and this project has run
# out once already — a dexing failure that left a heap dump in the tree. A
# machine with plenty of RAM hides that completely; a two-core CI runner
# building both variants in parallel does not, and reports it as a packaging
# task failing with no reason attached.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
